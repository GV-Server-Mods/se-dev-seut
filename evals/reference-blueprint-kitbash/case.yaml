schema_version: "1.1"
name: reference-blueprint-kitbash
expected_outcome: |
  A saved SEUT scene TestAntennaCrate (large grid, 1x1x3) built from the blueprint: a cargo-crate base about 2.5 m high, a cylinder clearly narrower than the crate (about 1.7 to 2.0 m across by pixel measurement of the front view) above it with a lit strip and a red beacon, and an antenna reaching the top of the third cell, all inside 2.5 x 2.5 x 7.5 m. Vanilla materials, surface detail as decals where possible, highlight empties linked to real meshes for the terminal strip and the container port, at most ten convex collision shapes, LODs, a clean export, and a report that lists where the views disagree.
context:
  scaffold_script: place-files.sh
